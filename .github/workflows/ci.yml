name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  build-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages for SFML
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl1-mesa-dev libfreetype-dev libopenal-dev \
            libflac-dev libvorbis-dev pkg-config autoconf automake \
            libtool libxinerama-dev libxext-dev

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: |
          mkdir -p .vcpkg-cache
          cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Test
        run: ctest --test-dir build/linux-debug --output-on-failure

  build-windows:
    name: Build and test (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-

      - name: Bootstrap vcpkg
        run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset windows-debug

      - name: Test
        run: ctest --test-dir build/windows-debug -C Debug --output-on-failure

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  sync-official:
    name: Push to the official repository
    needs: [build-linux, build-windows, docs]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'leroy-antoine/rtype'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OFFICIAL: git@github.com:EpitechPGE3-2026/G-ING-500-PAR-5-1-rtype-6.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the deploy key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.OFFICIAL_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push the branch
        run: |
          git remote add official "$OFFICIAL"
          git push official "HEAD:refs/heads/${GITHUB_REF_NAME}"
